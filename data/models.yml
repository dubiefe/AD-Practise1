# User model
User:
  required_vars:
    - email
    - name
  admissible_vars:
    - age
    - address
    - description
    - interests
    - skills
    - companies
    - educational_centers
  unique_indexes:
    - email
  regular_indexes:
    - name
  location_index: address

# Company model
Company:
  required_vars:
    - email
    - name
    - address
  unique_indexes:
    - email
  regular_indexes:
    - name
  location_index: address

# Educational_Center model
Educational_Center:
  required_vars:
    - email
    - name
    - address
  unique_indexes:
    - email
  regular_indexes:
    - name
  location_index: address
